name: tests
on: [push, pull_request]
jobs:
  installed-package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install build pytest
      - if: runner.os == 'Linux'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python -m pip check
      - run: python -m pytest -q -o pythonpath=
      - name: Installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          winding-field doctor
          winding-field demo --output demo
          winding-field resume demo
