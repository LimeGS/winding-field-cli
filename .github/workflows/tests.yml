name: tests
on: [push, pull_request]
jobs:
  installed-package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install build pytest
      - if: runner.os == 'Linux'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install original numerical library
        run: |
          CORE_REV=$(python -c "import json; print(json.load(open('provenance/core.json'))['revision'])")
          python -m pip install "winding-field-experiments @ https://github.com/LimeGS/winding-field/archive/$CORE_REV.tar.gz"
      - run: python -m build
      - run: python -m pip install dist/*.whl "matplotlib>=3.8,<4"
      - run: python -m pip check
      - run: python -m pytest -q -o pythonpath=
      - name: Installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          winding-field doctor
          winding-field demo --output demo
          winding-field resume demo
      - name: Installed prepared workflows and rendering
        run: |
          python -I examples/block_field.py --output "$RUNNER_TEMP/prepared-inputs" --stop-after-blocks 1
          python -I examples/block_field.py --output "$RUNNER_TEMP/prepared-inputs" --resume --prefetch
          winding-field prepared build --config "$RUNNER_TEMP/prepared-inputs/field-run.json" --output "$RUNNER_TEMP/prepared-field" --supervised --prefetch
          winding-field prepared resume --config "$RUNNER_TEMP/prepared-inputs/field-run.json" --output "$RUNNER_TEMP/prepared-field" --supervised --prefetch
          python -I examples/surface_pipeline.py --output "$RUNNER_TEMP/prepared-surfaces" --stop-after-tiles 3
          python -I examples/surface_pipeline.py --output "$RUNNER_TEMP/prepared-surfaces" --resume
          python -I examples/surface_pipeline.py --output "$RUNNER_TEMP/prepared-surfaces" --resume
          winding-field prepared render --mesh "$RUNNER_TEMP/prepared-surfaces/mesh" --output "$RUNNER_TEMP/prepared-views"
      - name: Installed surface and CT tools
        run: |
          winding-field surface-export --help
          winding-field surface-atlas --help
          winding-field surface-probe --help
          winding-field surface-geometry-check --help
          winding-field patch-visuals --help
          winding-field run-watch --help
          python -I examples/ct_visuals.py --output "$RUNNER_TEMP/ct-visuals"
