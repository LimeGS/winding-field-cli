name: tests
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest PyYAML
      - run: python -m pytest -q --durations=30 -o pythonpath= .github/tests/test_ci_workflows.py tests/test_container_layout.py tests/test_install_script.py

  installed-package:
    needs: preflight
    strategy:
      fail-fast: false
      # Pull requests get one Linux leg for fast feedback; pushes to main keep the full matrix.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","python":"3.11"}]' || '[{"os":"ubuntu-latest","python":"3.11"},{"os":"macos-latest","python":"3.12"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: '4'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CMAKE_ARGS: '-DVC_READER_ENABLE_CUDA=OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install build pytest wheel pytest-xdist packaging
      - name: Native CT build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libcurl4-openssl-dev libblosc-dev libzstd-dev liblz4-dev libsqlite3-dev nlohmann-json3-dev zlib1g-dev libtiff-dev libpng-dev libjpeg-dev
      - name: Native CT build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash cmake ninja pkgconf curl c-blosc zstd lz4 sqlite nlohmann-json libtiff libpng jpeg-turbo
          # Apple's Bash 3.2 silently ignores sourced process substitutions.
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Linux'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install original numerical library
        run: |
          CORE_REV=$(python -c "import json; print(json.load(open('provenance/core.json'))['revision'])")
          python -m pip install "winding-field @ git+https://github.com/LimeGS/winding-field@$CORE_REV"
      - run: python -m build
      # main resolves the wheel exactly as users install it; PRs reuse a cached vc-reader build.
      - if: github.event_name != 'pull_request'
        run: python -m pip install dist/*.whl "winding-field-cli[ct]" "matplotlib>=3.8,<4" "libigl==2.6.3" "tifffile>=2023.7"
      - name: Pinned vc-reader requirement
        if: github.event_name == 'pull_request'
        id: vc
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import hashlib, tomllib
          from packaging.requirements import Requirement
          project = tomllib.load(open('pyproject.toml', 'rb'))['project']
          (spec,) = [r for r in project['dependencies'] if Requirement(r).name == 'vc-reader']
          print('spec=' + spec)
          print('key=' + hashlib.sha256(spec.encode()).hexdigest()[:16])
          EOF
      - name: Cached vc-reader wheel
        if: github.event_name == 'pull_request'
        id: vc-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/vc-reader-wheel
          key: vc-reader-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python }}-${{ steps.vc.outputs.key }}
      - if: github.event_name == 'pull_request' && steps.vc-cache.outputs.cache-hit != 'true'
        run: python -m pip wheel --no-deps --wheel-dir ~/vc-reader-wheel "${{ steps.vc.outputs.spec }}"
      # Save immediately so a later test failure does not discard the native build.
      - if: github.event_name == 'pull_request' && steps.vc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/vc-reader-wheel
          key: ${{ steps.vc-cache.outputs.cache-primary-key }}
      - name: Install wheel with cached vc-reader (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install ~/vc-reader-wheel/*.whl
          python - <<'EOF' > "$RUNNER_TEMP/requirements.txt"
          import tomllib
          from packaging.requirements import Requirement
          project = tomllib.load(open('pyproject.toml', 'rb'))['project']
          for r in project['dependencies'] + project['optional-dependencies'].get('ct', []):
              if Requirement(r).name not in ('vc-reader', 'winding-field'):
                  print(r)
          EOF
          python -m pip install --no-deps dist/*.whl
          python -m pip install -r "$RUNNER_TEMP/requirements.txt" "matplotlib>=3.8,<4" "libigl==2.6.3" "tifffile>=2023.7"
      - run: python -I -c "from vc_reader.reader import ObjectStore, ZarrReader, decode_chunk; from vc_reader import _reader; assert hasattr(_reader.DiskCache, 'write')"
      - run: python -m pip check
      # SLIM is Flatboi: Linux runs provide the pinned AppImage runtime and require it.
      - name: Cached Flatboi runtime (Linux)
        if: runner.os == 'Linux'
        id: flatboi-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/winding-field/flatboi
          key: flatboi-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('provenance/flatboi.json') }}
      - if: runner.os == 'Linux' && steps.flatboi-cache.outputs.cache-hit != 'true'
        run: python -m winding_field.flattening.flatboi --provision
      - if: runner.os == 'Linux' && steps.flatboi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/winding-field/flatboi
          key: ${{ steps.flatboi-cache.outputs.cache-primary-key }}
      - run: python -m pytest -q --durations=30 -o pythonpath= -n auto --dist loadfile
        env:
          WINDING_REQUIRE_FLATBOI: ${{ runner.os == 'Linux' && '1' || '0' }}
      # The base commit's verifier and REVIEW.md judge the change, so it cannot weaken its own checks.
      - name: Verify against the base commit
        if: runner.os == 'Linux'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          WINDING_REQUIRE_FLATBOI: '1'
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git cat-file -e "$BASE_SHA:tools/verify.py" 2>/dev/null; then
            git show "$BASE_SHA:tools/verify.py" > "$RUNNER_TEMP/verify.py"
          else
            echo "::notice::base has no tools/verify.py yet; using this commit's copy"
            cp tools/verify.py "$RUNNER_TEMP/verify.py"
          fi
          python "$RUNNER_TEMP/verify.py" --repo . --baseline "$BASE_SHA" --receipt "$RUNNER_TEMP/VERIFY.json"
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: verify-receipt
          path: ${{ runner.temp }}/VERIFY.json
          if-no-files-found: ignore
      - name: Installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          winding-field doctor
          winding-field demo --output demo
          winding-field resume demo
      - name: Installed prepared workflows and rendering
        run: |
          python -I examples/block_field.py --output "$RUNNER_TEMP/prepared-inputs" --stop-after-blocks 1
          python -I examples/block_field.py --output "$RUNNER_TEMP/prepared-inputs" --resume --prefetch
          winding-field prepared build --config "$RUNNER_TEMP/prepared-inputs/field-run.json" --output "$RUNNER_TEMP/prepared-field" --supervised --prefetch
          winding-field prepared resume --config "$RUNNER_TEMP/prepared-inputs/field-run.json" --output "$RUNNER_TEMP/prepared-field" --supervised --prefetch
          python -I examples/surface_pipeline.py --output "$RUNNER_TEMP/prepared-surfaces" --stop-after-tiles 3
          python -I examples/surface_pipeline.py --output "$RUNNER_TEMP/prepared-surfaces" --resume
          python -I examples/surface_pipeline.py --output "$RUNNER_TEMP/prepared-surfaces" --resume
          winding-field prepared render --mesh "$RUNNER_TEMP/prepared-surfaces/mesh" --output "$RUNNER_TEMP/prepared-views"
      - name: Installed surface and CT tools
        run: |
          winding-field surface-export --help
          winding-field surface-atlas --help
          winding-field surface-probe --help
          winding-field surface-geometry-check --help
          winding-field patch-visuals --help
          winding-field run-watch --help
          python -I examples/ct_visuals.py --output "$RUNNER_TEMP/ct-visuals"
