name: containers
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      cuda:
        description: Build CUDA on a self-hosted nvidia runner (60 GiB free disk)
        type: boolean
        default: false
      gpu:
        description: Also run real CUDA operations and model inference (requires cuda)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    # A release tag only promotes an image main already qualified (see release); it builds nothing.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest PyYAML
      - run: python -m pytest -q --durations=30 -o pythonpath= .github/tests/test_ci_workflows.py tests/test_container_layout.py tests/test_install_script.py

  cpu:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        id: buildx
      - name: Build CPU image with persistent cache
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          source: .
          targets: cpu
          load: true
          set: |
            cpu.cache-from=type=gha,scope=winding-field-cli-cpu
            cpu.cache-to=type=gha,scope=winding-field-cli-cpu,mode=max,ignore-error=true
      - name: Installed non-root runtime and offline workflows
        run: |
          mkdir -p "$RUNNER_TEMP/wf"/{outputs,models,cache,scratch}
          docker run --rm --init --network=none --user "$(id -u):$(id -g)" --memory=6g --memory-swap=6g \
            --mount "type=bind,src=$RUNNER_TEMP/wf/outputs,dst=/outputs" \
            --mount "type=bind,src=$RUNNER_TEMP/wf/models,dst=/home/worker/.cache/winding-field/models" \
            --mount "type=bind,src=$RUNNER_TEMP/wf/cache,dst=/cache" \
            --mount "type=bind,src=$RUNNER_TEMP/wf/scratch,dst=/scratch" \
            --entrypoint sh winding-field:cpu -ec \
            'python /opt/runtime-provenance/docker/verify-runtime.py --variant cpu && python /opt/runtime-provenance/docker/smoke.py --output /outputs/smoke'
      - name: Any UID with only /outputs mounted
        # The documented one-mount use: caches, scratch and models stay writable inside the image.
        run: |
          mkdir -p "$RUNNER_TEMP/wf-one"
          docker run --rm --init --network=none --user "$(id -u):$(id -g)" --memory=6g --memory-swap=6g \
            -v "$RUNNER_TEMP/wf-one:/outputs" --entrypoint sh winding-field:cpu -ec \
            'for d in /cache /scratch /home/worker/.cache/winding-field/models /home/worker/.cache/winding-field/patch-ct/; do touch "$d/w" && rm "$d/w"; done
             python /opt/runtime-provenance/docker/smoke.py --output /outputs/smoke'
      - name: Installed suite with official native checkpoint qualification
        # The image build and offline smoke above still gate pull requests; the full in-image suite runs on main.
        if: github.event_name != 'pull_request'
        run: |
          # Test-tool installation needs runner DNS; the runtime smoke above stays offline.
          docker build --network=host -f docker/testing.Dockerfile -t winding-field:cpu-tests .
          docker run --rm --init --user "$(id -u):$(id -g)" --memory=6g --memory-swap=6g \
            -e MATRIX_NATIVE_APP=/opt/vc3d/AppRun -e MATRIX_NATIVE_RECIPE=historical \
            -e WINDING_LASAGNA_PYTHON=/opt/lasagna/bin/python \
            -e WINDING_REQUIRE_FLATBOI=1 \
            --mount "type=bind,src=$PWD/tests,dst=/tests,readonly" \
            --mount "type=bind,src=$PWD/examples,dst=/examples,readonly" \
            --mount "type=bind,src=$PWD/tools,dst=/tools,readonly" \
            --mount "type=bind,src=$PWD/benchmarks,dst=/benchmarks,readonly" \
            --mount "type=bind,src=$PWD/pyproject.toml,dst=/pyproject.toml,readonly" \
            --mount "type=bind,src=$PWD/README.md,dst=/README.md,readonly" \
            --mount "type=bind,src=$PWD/MANIFEST.in,dst=/MANIFEST.in,readonly" \
            --mount "type=bind,src=$PWD/THIRD_PARTY.md,dst=/THIRD_PARTY.md,readonly" \
            --mount "type=bind,src=$PWD/licenses,dst=/licenses,readonly" \
            --mount "type=bind,src=$PWD/docs,dst=/docs,readonly" \
            --mount "type=bind,src=$PWD/uv.toml,dst=/uv.toml,readonly" \
            --mount "type=bind,src=$PWD/provenance,dst=/provenance,readonly" \
            --mount "type=bind,src=$PWD/docker,dst=/docker,readonly" \
            --mount "type=bind,src=$PWD/REVIEW.md,dst=/REVIEW.md,readonly" \
            --mount "type=bind,src=$PWD/compose.yaml,dst=/compose.yaml,readonly" \
            --mount "type=bind,src=$PWD/docker-bake.hcl,dst=/docker-bake.hcl,readonly" \
            --mount "type=bind,src=$PWD/.claude/skills,dst=/.claude/skills,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/wf/scratch,dst=/scratch" \
            --mount "type=bind,src=$RUNNER_TEMP/wf/outputs,dst=/outputs" \
            --mount "type=bind,src=$RUNNER_TEMP/wf/cache,dst=/cache" \
            winding-field:cpu-tests -q --durations=30 -o pythonpath= -o cache_dir=/scratch/pytest-cache /tests

  publish:
    # Rolling: every push to main publishes the CPU image the cpu job just built and qualified,
    # as edge-cpu and sha-<commit>-cpu. Version tags come only from the release job.
    needs: cpu
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        id: buildx
      - name: Rebuild the qualified CPU image from its cache
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          source: .
          targets: cpu
          load: true
          set: |
            cpu.cache-from=type=gha,scope=winding-field-cli-cpu
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ghcr.io/<owner>/winding-field-cli
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/winding-field-cli"
          for tag in edge-cpu "sha-${GITHUB_SHA::7}-cpu"; do
            docker tag winding-field:cpu "$image:$tag"
            docker push "$image:$tag"
          done

  release:
    # Stable: pushing the git tag vX.Y.Z promotes the image main qualified and published for
    # that exact commit to X.Y.Z-cpu and cpu. Nothing is rebuilt; a release is never overwritten.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the qualified image of this commit
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the pyproject version $version"; exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/winding-field-cli"
          source="$image:sha-${GITHUB_SHA::7}-cpu"
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}'; }
          if ! qualified=$(digest "$source"); then
            echo "::error::$source is not published: tag a main commit whose CPU image qualified"; exit 1
          fi
          if released=$(digest "$image:$version-cpu" 2>/dev/null) && [ "$released" != "$qualified" ]; then
            echo "::error::$version-cpu is already published with other contents; releases are never overwritten"; exit 1
          fi
          docker buildx imagetools create --tag "$image:$version-cpu" --tag "$image:cpu" "$source"

  cuda:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.cuda
    runs-on: [self-hosted, linux, x64, nvidia]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: docker buildx bake cuda --load
      - name: CUDA imports without GPU execution
        run: docker run --rm --entrypoint python winding-field:cuda /opt/runtime-provenance/docker/verify-runtime.py --variant cu128
      - name: Real GPU operations and pinned model inference
        if: inputs.gpu
        run: |
          mkdir -p "$RUNNER_TEMP/wf-gpu"/{outputs,models,cache,scratch}
          docker run --rm --init --gpus 'device=0' --user "$(id -u):$(id -g)" --memory=16g --memory-swap=16g \
            --mount "type=bind,src=$RUNNER_TEMP/wf-gpu/outputs,dst=/outputs" \
            --mount "type=bind,src=$RUNNER_TEMP/wf-gpu/models,dst=/home/worker/.cache/winding-field/models" \
            --mount "type=bind,src=$RUNNER_TEMP/wf-gpu/cache,dst=/cache" \
            --mount "type=bind,src=$RUNNER_TEMP/wf-gpu/scratch,dst=/scratch" \
            --entrypoint sh winding-field:cuda -ec \
            'python /opt/runtime-provenance/docker/verify-runtime.py --variant cu128 --gpu && python /opt/runtime-provenance/docker/smoke.py --output /outputs/smoke --models --device cuda:0'
