name: xhost-probe
on:
  push:
    branches: [claude/project-thread-i074uw]
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '4'
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      CMAKE_ARGS: '-DVC_READER_ENABLE_CUDA=OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install build wheel packaging
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libcurl4-openssl-dev libblosc-dev libzstd-dev liblz4-dev libsqlite3-dev nlohmann-json3-dev zlib1g-dev libtiff-dev libpng-dev libjpeg-dev
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          CORE_REV=$(python -c "import json; print(json.load(open('provenance/core.json'))['revision'])")
          python -m pip install "winding-field @ git+https://github.com/LimeGS/winding-field@$CORE_REV"
      - name: Build vc-reader twice (two independent source builds, like two hosts)
        run: |
          SPEC=$(python -c "import tomllib;from packaging.requirements import Requirement as R;print([r for r in tomllib.load(open('pyproject.toml','rb'))['project']['dependencies'] if R(r).name=='vc-reader'][0])")
          for i in 1 2; do (cd $(mktemp -d) && python -m pip wheel --no-deps --no-cache-dir --wheel-dir ~/vc$i "$SPEC"); done
          for i in 1 2; do mkdir -p ~/x$i && (cd ~/x$i && python -m zipfile -e ~/vc$i/*.whl .); done
          echo "== native binaries sha256 (build 1 vs build 2)"
          (cd ~/x1 && find . -name '*.so*' -type f | sort | xargs sha256sum)
          (cd ~/x2 && find . -name '*.so*' -type f | sort | xargs sha256sum)
      - run: |
          python -m build
          python -m pip install ~/vc1/*.whl
          python - <<'EOF' > "$RUNNER_TEMP/req.txt"
          import tomllib
          from packaging.requirements import Requirement
          p = tomllib.load(open('pyproject.toml', 'rb'))['project']
          for r in p['dependencies'] + p['optional-dependencies'].get('ct', []):
              if Requirement(r).name not in ('vc-reader', 'winding-field'):
                  print(r)
          EOF
          python -m pip install --no-deps dist/*.whl
          python -m pip install -r "$RUNNER_TEMP/req.txt"
      - run: bash tools/xhost/xhost_test.sh
