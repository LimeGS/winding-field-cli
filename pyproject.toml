[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winding-field-cli"
version = "0.1.0"
description = "Resumable original-CT to winding-field, meshes and linked flat charts"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = ["winding-field==1.3.0.dev2", "numpy>=1.26,<3", "scipy>=1.11", "torch>=2.6", "scikit-image>=0.22", "numcodecs>=0.12", "Pillow>=10", "dynamic-network-architectures==0.4.4", "avf-spline-generator @ https://github.com/Qualzz/AVF_SPLINE_GENERATOR/archive/3c8b73628ca56cb28042b9b2e79439b2e1c693d2.tar.gz", "vc-reader @ https://github.com/LimeGS/villa/archive/84207424c3a988e6cafe6b50fe7d4d7e5f839929.tar.gz#subdirectory=vc_reader"]

[project.optional-dependencies]
ct = []
plot = ["matplotlib>=3.8,<4"]
test = ["pytest>=8", "build>=1", "matplotlib>=3.8,<4"]
tifxyz = ["libigl==2.6.3", "tifffile>=2023.7"]

[project.scripts]
winding-field = "winding_field.cli:main"

[project.urls]
Repository = "https://github.com/LimeGS/winding-field-cli"
Documentation = "https://github.com/LimeGS/winding-field-cli/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
winding_field = ["native/predicates.h", "native/predicates.cpp", "native/predicates.cu"]
"winding_field._vendor" = ["qual_plans.json"]

[tool.setuptools.data-files]
"share/winding-field-cli/provenance" = ["provenance/core.json", "provenance/villa.json", "provenance/qual.json", "provenance/lasagna.json", "provenance/flatboi.json", "provenance/tifxyz-guide.json", "provenance/original-recipe.json"]
"share/winding-field-cli" = ["THIRD_PARTY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
