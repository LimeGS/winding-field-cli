[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winding-field-cli"
version = "2.0.0"
description = "Resumable original-CT to winding-field, meshes and linked flat charts"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = [
  "winding-field @ git+https://github.com/LimeGS/winding-field@3d1b8511f03d4a1c97550dd3d864b809445a518b",
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "torch>=2.6",
  "scikit-image>=0.22",
  "numcodecs>=0.12",
  "Pillow>=10",
  "PyYAML>=6,<7",
  "libigl==2.6.3",
  "dynamic-network-architectures==0.4.4",
  "avf-spline-generator @ https://github.com/Qualzz/AVF_SPLINE_GENERATOR/archive/3c8b73628ca56cb28042b9b2e79439b2e1c693d2.tar.gz",
  "vc-reader @ https://github.com/LimeGS/villa/archive/84207424c3a988e6cafe6b50fe7d4d7e5f839929.tar.gz#subdirectory=vc_reader",
  # TIFXYZ is the default flattened output, so its writer is no longer optional.
  "tifffile>=2023.7",
]

[project.optional-dependencies]
ct = []
plot = ["matplotlib>=3.8,<4"]
test = ["pytest>=8", "build>=1", "matplotlib>=3.8,<4"]
tifxyz = ["tifffile>=2023.7"]

[project.scripts]
winding-field = "winding_field.cli:main"

[project.urls]
Repository = "https://github.com/LimeGS/winding-field-cli"
Documentation = "https://github.com/LimeGS/winding-field-cli/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
winding_field = ["native/predicates.h", "native/predicates.cpp", "native/predicates.cu", "native/afv_clip.cpp", "_native/vc3d/AppRun", "_native/vc3d/usr/bin/flatboi"]
"winding_field._vendor" = ["qual_plans.json"]

[tool.setuptools.data-files]
"share/winding-field-cli/provenance" = ["provenance/core.json", "provenance/villa.json", "provenance/qual.json", "provenance/lasagna.json", "provenance/flatboi.json", "provenance/tifxyz-guide.json", "provenance/original-recipe.json"]
"share/winding-field-cli" = ["THIRD_PARTY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = [
  "src/winding_field/_vendor",
  # Hash-pinned in provenance; must stay byte-identical.
  "src/winding_field/surface_render.py",
]

[tool.ruff.lint]
# Likely bugs and maintainability, not cosmetic churn (same base set as the core).
select = ["E4", "E7", "E9", "F", "W", "UP"]
ignore = [
  # Receipt strings, argparse help and printed evidence lines are deliberately long.
  "E501",
  # Tools insert src/ into sys.path before importing it.
  "E402",
  # Short numeric helpers read better as one-line lambdas.
  "E731",
]

[tool.ruff.lint.per-file-ignores]
# Test modules import shared pytest fixtures by name and take them as arguments.
"tests/*.py" = ["F811"]
# A closure reads a name that is deleted later in the same scope (ruff false positive).
"src/winding_field/flattening/patches.py" = ["F821"]
"src/winding_field/flattening/original_pipeline.py" = ["F821"]
